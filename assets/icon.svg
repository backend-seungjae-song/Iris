<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 두 손이 하나를 쥔다. 왼쪽은 짙게(사람), 오른쪽은 옅게(AI) — 같은 색의 강도 차로만 가른다.
       macOS Big Sur 규격: 1024 캔버스 안 824 둥근 사각(여백 100), 모서리 185. 바깥은 투명. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173142"/>
      <stop offset="0.55" stop-color="#0F1E2B"/>
      <stop offset="1" stop-color="#0A1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FA" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#EAF3FA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#BFF4FB"/>
      <stop offset="0.55" stop-color="#85E8F6"/>
      <stop offset="1" stop-color="#3FC6E0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="120" fill="#85E8F6" opacity="0.20" filter="url(#soft)"/>
  <path d="M378 288 A272 272 0 0 0 378 736" fill="none" stroke="#EAF3FA" stroke-width="74" stroke-linecap="round"/>
  <path d="M646 288 A272 272 0 0 1 646 736" fill="none" stroke="#8FB0C4" stroke-width="74" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="78" fill="url(#dot)"/>
</svg>

name: iris_remote
description: "Iris 안드로이드 원격 제어 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.0
  markdown: ^7.3.1
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/agents/
    - assets/icons/
    - assets/logos/
